name: Build Flutter APK

on:
  push:
    branches: ["main", "master", "ana"]
  pull_request:
    branches: ["main", "master", "ana"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: stable
          cache: true

      - name: Ensure Flutter Android project files exist
        run: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            flutter create --platforms=android --org com.kasikai --project-name kasik_ai .
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/minSdkVersion(.*/minSdkVersion(21)/' android/app/build.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasik-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
